[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "badnet"
version = "1.0.0"
description = "BADNET - CLI-first network forensics and CTF investigation tool"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BADNET contributors" }]
keywords = ["pcap", "forensics", "ctf", "network", "tshark", "dfir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "scapy>=2.5",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
magic = ["python-magic>=0.4.27"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
badnet = "badnet.cli:run"

[project.urls]
Homepage = "https://example.invalid/badnet"

[tool.setuptools.packages.find]
include = ["badnet*"]

[tool.setuptools.package-data]
badnet = ["reporting/templates/*.j2", "reporting/assets/*.css"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by the formatter
    "SIM108",  # ternary rewrites hurt readability in security code
    "B008",
    "RUF001",  # ambiguous unicode: flag patterns legitimately contain unicode
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ['\.venv', 'output']

[[tool.mypy.overrides]]
module = ["scapy.*", "magic.*"]
ignore_missing_imports = true