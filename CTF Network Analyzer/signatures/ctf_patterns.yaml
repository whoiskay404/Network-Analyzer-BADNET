# BADNET CTF / indicator signatures.
#
# Every pattern below produces a Finding with a hedged title, an explanation of
# WHY it fired, and the matched evidence.  Pattern semantics:
#
#   id          stable name (used for dedup and for suppressing duplicates)
#   title       shown in reports - keep it hedged ("Possible ...", "Interesting ...")
#   regex       Python `re` pattern, matched case-sensitively unless (?i) is inline
#   severity    info | low | medium | high        (attention, not risk)
#   confidence  low | medium | high              (how sure the match is what it claims)
#   category    flag | credential | secret | encoding | endpoint | dns | data
#   description why this pattern is interesting - printed as part of the finding
#   tags        free-form labels for filtering
#
# To add your own: copy this file to ~/.config/badnet/signatures/ctf_patterns.yaml,
# point `signature_dir` at it, or drop the file next to your capture.  BADNET
# reads every *.yaml in signature_dir and merges the pattern lists.

version: 1

patterns:
  # ---------------------------------------------------------------- CTF flags
  - id: flag_brace
    title: "Possible CTF flag (brace form)"
    regex: '(?i)\b(?:flag|ctf|key|token|secret)[-_a-z0-9]{0,12}\{[^\s"''<>\\]{1,120}\}'
    severity: high
    confidence: high
    category: flag
    description: >-
      A token with the classic flag/ctf naming and a brace-delimited body. This
      shape is specific enough that it is almost always the challenge answer,
      but it is still reported as "possible" because a decoy may exist.
    tags: [ctf, flag, high-value]

  - id: flag_generic_brace
    title: "Possible CTF indicator (brace-delimited token)"
    regex: '(?i)\b(?!(?:flag|ctf|key|token|secret|picoctf|htb|thm|tryhackme|bugcrowd|cyberctf|cryptohack))[A-Za-z][A-Za-z0-9_]{1,20}\{[A-Za-z0-9_\-!@#$%^&*+=./:, ]{4,120}\}'
    severity: medium
    confidence: medium
    category: flag
    description: >-
      Any word followed by a brace-delimited body, for flags with an unknown
      prefix. Known prefixes (flag/ctf/key/token/secret and CTF platforms) are
      deliberately excluded so they are reported once, by the sharper patterns
      above, not twice. Still matches GUID-ish and templated strings, so
      confidence is medium.
    tags: [ctf, flag, heuristic]

  - id: flag_prefix
    title: "Possible CTF flag (prefixed form)"
    regex: '(?i)\b(?:flag|ctf)[-_][A-Za-z0-9_\-]{6,64}\b'
    severity: medium
    confidence: medium
    category: flag
    description: A "flag-" / "ctf-" prefixed token without braces.
    tags: [ctf, flag]

  - id: picoctf_style
    title: "Possible CTF flag (platform prefix style)"
    regex: '(?i)\b(?:picoctf|htb|thm|tryhackme|bugcrowd|cyberctf|cryptohack)\{[^}\s]{1,120}\}'
    severity: high
    confidence: high
    category: flag
    description: Brace-delimited token prefixed by a known CTF platform name.
    tags: [ctf, flag, platform]

  # --------------------------------------------------------------- credentials
  - id: user_password_pair
    title: "Possible plaintext credential pair"
    regex: '(?i)\b(?:user(?:name)?|login|user)\b\s*[:=]\s*["'']?([^\s"''&,;]{1,64})[\s"'']*,?\s*(?:and\s+)?(?:pass(?:word|wd)?|secret)\s*[:=]\s*["'']?([^\s"''&,;]{1,64})'
    severity: high
    confidence: medium
    category: credential
    description: >-
      A username immediately followed by a password on the same line. Common in
      lab logins, configuration dumps and challenge hints.
    tags: [credential, plaintext]

  - id: email_password_pair
    title: "Possible credential pair (email + password)"
    regex: '(?i)\b[\w.+-]{1,64}@[\w.-]{2,64}\b[^\n]{0,20}?(?:pass(?:word|wd)?|pwd)\s*[:=]\s*["'']?([^\s"''&,;]{1,64})'
    severity: high
    confidence: medium
    category: credential
    description: An email address followed closely by a password assignment.
    tags: [credential, plaintext]

  - id: basic_auth_blob
    title: "Possible HTTP Basic credential"
    regex: '\bBasic\s+[A-Za-z0-9+/]{8,}={0,2}\b'
    severity: medium
    confidence: medium
    category: credential
    description: >-
      A base64 "user:password" blob in the Authorization header. The blob is
      trivially reversible - BADNET decodes it for the investigator.
    tags: [credential, http, base64]

  - id: bearer_token
    title: "Possible bearer / API token"
    regex: '(?i)\bBearer\s+[A-Za-z0-9._~+/=-]{12,}'
    severity: medium
    confidence: medium
    category: credential
    description: "An `Authorization: Bearer` credential observed in cleartext."
    tags: [credential, http, token]

  - id: session_cookie_value
    title: "Possible session identifier"
    regex: '(?i)\b(?:PHPSESSID|JSESSIONID|sess(?:ion)?id|csrf(?:token)?|_token|auth_token|jwt)\s*=\s*[A-Za-z0-9_\-.]{8,}'
    severity: low
    confidence: medium
    category: credential
    description: >-
      A session/CSRF token in a cookie or parameter. Session identifiers are
      common and not inherently interesting; they are listed so they are easy
      to pivot on when they appear next to a real account.
    tags: [credential, cookie, session]

  - id: private_key_block
    title: "Private key material"
    regex: '-----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY(?: BLOCK)?-----'
    severity: high
    confidence: high
    category: secret
    description: >-
      A PEM-encoded private key transferred in the clear. Strong evidence of
      sensitive material in the capture; it says nothing about intent.
    tags: [secret, key, pem, high-value]

  # ------------------------------------------------------------------- secrets
  - id: aws_access_key_id
    title: "Possible AWS access key id"
    regex: '\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'
    severity: high
    confidence: high
    category: secret
    description: Matches the documented AWS access key id prefixes and length.
    tags: [secret, cloud, aws]

  - id: aws_secret_key
    title: "Possible AWS secret access key"
    regex: '(?i)\baws_?secret_?access_?key\s*[:=]\s*["'']?([A-Za-z0-9/+=]{40})'
    severity: high
    confidence: high
    category: secret
    description: A labelled 40-character AWS secret access key.
    tags: [secret, cloud, aws]

  - id: google_api_key
    title: "Possible Google API key"
    regex: '\bAIza[0-9A-Za-z_\-]{35}\b'
    severity: medium
    confidence: high
    category: secret
    description: Matches the documented Google API key prefix and length.
    tags: [secret, cloud, gcp]

  - id: slack_token
    title: "Possible Slack token"
    regex: '\bxox[abposr]-[A-Za-z0-9-]{10,}'
    severity: high
    confidence: high
    category: secret
    description: Matches documented Slack token prefixes.
    tags: [secret, chat, slack]

  - id: github_token
    title: "Possible GitHub token"
    regex: '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}'
    severity: high
    confidence: high
    category: secret
    description: Matches documented GitHub personal access / app token prefixes.
    tags: [secret, vcs, github]

  - id: jwt_token
    title: "Possible JWT"
    regex: '\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{4,}'
    severity: medium
    confidence: high
    category: secret
    description: >-
      A three-part JWT-shaped token. BADNET decodes the header and payload for
      the report and never validates the signature or trusts any claim inside.
    tags: [secret, jwt, token]

  - id: generic_api_key_assignment
    title: "Possible secret assigned in the clear"
    regex: '(?i)\b(?:api[_\-]?key|apikey|secret[_\-]?key|access[_\-]?token|auth[_\-]?token|client[_\-]?secret)\b\s*[:=]\s*["'']?([A-Za-z0-9_\-./+=]{12,120})'
    severity: medium
    confidence: low
    category: secret
    description: >-
      A key/token/secret-looking name with a long literal value. Confidence is
      low because placeholder values (xxxxx, changeme, ${ENV_VAR}) also match.
    tags: [secret, heuristic]

  - id: password_assignment
    title: "Possible password in cleartext"
    regex: '(?i)\b(?:pass(?:word|wd)?|pwd)\s*[:=]\s*["'']?([^\s"''&,;<>]{4,128})'
    severity: medium
    confidence: low
    category: credential
    description: >-
      A password assignment in captured content. Low confidence: many matches
      are form placeholders, validation rules or documentation text.
    tags: [credential, heuristic]

  # ----------------------------------------------------------------- endpoints
  - id: hidden_git
    title: "Interesting endpoint (version-control metadata)"
    regex: '(?i)/(?:^|/)\.git/(?:HEAD|config|index|objects/)'
    severity: medium
    confidence: high
    category: endpoint
    description: >-
      A request for .git metadata. Exposed repositories frequently leak full
      source and history; this is a common CTF foothold.
    tags: [endpoint, git, recon]

  - id: dotenv
    title: "Interesting endpoint (environment file)"
    regex: '(?i)/(?:^|/)\.env(?:\.[A-Za-z0-9_]+)?(?:\?|$|["''])'
    severity: medium
    confidence: high
    category: endpoint
    description: A request for .env, which commonly contains live credentials.
    tags: [endpoint, credentials]

  - id: backup_file
    title: "Interesting endpoint (backup / dump file)"
    regex: '(?i)\.(?:bak|old|orig|save|swp|sql|sqlite|db|dump|tar\.gz|tgz|7z|rar|zip)(?:\?|$|["'' ])'
    severity: medium
    confidence: medium
    category: endpoint
    description: A request for a backup, dump or archive file.
    tags: [endpoint, data]

  - id: admin_endpoint
    title: "Interesting endpoint (admin / management path)"
    regex: '(?i)/(?:admin|administrator|phpmyadmin|wp-admin|manager/html|actuator(?:/[\w.-]*)?|server-status|adminer)(?:\b|/|\?)'
    severity: low
    confidence: medium
    category: endpoint
    description: >-
      An administrative path was requested. Requesting an admin URL is
      completely normal in most captures; it is listed because challenge
      traffic often pivots through one.
    tags: [endpoint, admin]

  - id: shell_exec
    title: "Interesting endpoint (command execution path)"
    regex: '(?i)/(?:cgi-bin/(?:[^/\s"''?]*\.(?:cgi|pl|sh)|[^/\s"''?]*)|cmd|exec|eval|shell|passthru)(?:\b|/|\?)'
    severity: medium
    confidence: medium
    category: endpoint
    description: >-
      A request path that looks like a command-execution interface. Reported as
      an interesting endpoint, not as an attack.
    tags: [endpoint, execution]

  - id: internal_hostname
    title: "Possible internal hostname reference"
    regex: '(?i)\b(?:[a-z0-9][a-z0-9\-]{0,62}\.)+(?:internal|intranet|corp|lan|local|localhost|test|dev|staging)(?::\d{1,5})?\b'
    severity: info
    confidence: medium
    category: metadata
    description: >-
      A name that looks like an internal/staging hostname. Useful for mapping
      the lab's internal naming scheme.
    tags: [metadata, internal, recon]

  - id: localhost_reference
    title: "Loopback reference"
    regex: '(?i)\b(?:127\.0\.0\.1|localhost|0\.0\.0\.0)(?::\d{1,5})?\b'
    severity: info
    confidence: high
    category: metadata
    description: >-
      A loopback address or hostname in content. Expected in SSRF-style
      challenges and in local test traffic.
    tags: [metadata, loopback]

  # --------------------------------------------------------------------- misc
  - id: tor_onion
    title: "Tor hidden service address"
    regex: '\b[a-z2-7]{16,56}\.onion\b'
    severity: low
    confidence: high
    category: metadata
    description: A .onion hostname (v2 or v3). Recorded for context only.
    tags: [metadata, tor]

  - id: crypto_wallet
    title: "Possible cryptocurrency address"
    regex: '\b(?:bc1[a-z0-9]{25,62}|[13][a-km-zA-HJ-NP-Z1-9]{25,34}|0x[a-fA-F0-9]{40})\b'
    severity: low
    confidence: low
    category: metadata
    description: >-
      A base58/bech32/hex string shaped like a Bitcoin or Ethereum address.
      Confidence is low because hashes and IDs share the shape.
    tags: [metadata, crypto, heuristic]

  - id: credit_card_luhn
    title: "Possible payment card number"
    regex: '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\b'
    severity: medium
    confidence: low
    category: secret
    description: >-
      A 13-16 digit number matching an issuer prefix. BADNET does not run a Luhn
      check in this pattern; treat it as a lead, not a finding.
    tags: [pii, payment, heuristic]

  - id: commented_password_sql
    title: "Possible commented-out credential"
    regex: '(?i)--[^\n]{0,40}(?:pass|pwd|secret|token)\s*[:=]\s*(\S{4,64})'
    severity: low
    confidence: low
    category: credential
    description: A SQL/HTML comment containing something that looks like a secret.
    tags: [credential, comment, heuristic]