# Ports and services BADNET highlights.
#
# IMPORTANT: an unusual port is not evidence of malicious activity.  In most
# CTFs and lab captures the interesting service is deliberately moved off its
# standard port - that is the *only* reason this list exists.  Terminal output
# that highlights these ports always says so in words.
#
# `services` maps ports to the service name BADNET assumes for display purposes
# when tshark does not know better; `interesting` is the highlight list.

version: 1

interesting:
  - 21
  - 22
  - 23
  - 25
  - 53
  - 80
  - 110
  - 139
  - 143
  - 443
  - 445
  - 3306
  - 3389
  - 5000
  - 8000
  - 8080
  - 8443

