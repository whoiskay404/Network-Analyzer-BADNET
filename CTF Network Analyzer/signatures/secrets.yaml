# BADNET secret-detection signatures.
#
# Same schema as ctf_patterns.yaml.  Kept separate so an organisation can swap
# secret rules independently of the CTF rules (e.g. an internal key prefix).
#
# `decoders` lists decodings attempted on a match before reporting it, so the
# report can say "the matched blob base64-decodes to X" instead of leaving the
# analyst to do it by hand.

version: 1

patterns:
  - id: password_kv_json
    title: "Possible credential in JSON data"
    regex: '(?i)"(?:pass(?:word|wd)?|pwd|secret)"\s*:\s*"([^"\\]{3,128})"'
    severity: medium
    confidence: high
    category: credential
    decoders: [json_string]
    description: >-
      A JSON field whose name is a password and whose value is a literal string.
      One of the most reliable credential indicators in structured traffic.
    tags: [credential, json]

  - id: password_kv_form
    title: "Possible credential in form/query data"
    regex: '(?i)\b(?:^|[&;\s])(?:pass(?:word|wd)?|pwd|pass)=([^&\s;"'']{3,128})'
    severity: medium
    confidence: high
    category: credential
    decoders: [url]
    description: A password= parameter in a submitted form body or query string.
    tags: [credential, form, http]

  - id: client_secret_kv
    title: "Possible OAuth client secret"
    regex: '(?i)client[_\-]?secret\s*[:=]\s*["'']?([A-Za-z0-9_\-./+=]{16,128})'
    severity: high
    confidence: medium
    category: secret
    description: A labelled OAuth-style client secret in captured content.
    tags: [secret, oauth]

  - id: connection_string_password
    title: "Possible database connection string with password"
    regex: '(?i)\b(?:mysql|postgres(?:ql)?|mongodb(?:\+srv)?|redis|amqp|mssql|oracle)://[^\s:@/]{1,64}:([^\s:@/]{1,128})@'
    severity: high
    confidence: high
    category: secret
    decoders: [url]
    description: >-
      A database URI with an inline password. The password is extracted so the
      analyst does not have to un-escape it by hand.
    tags: [secret, database]

  - id: private_key_pem
    title: "Private key material (PEM)"
    regex: '-----BEGIN (?:RSA |DSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----'
    severity: high
    confidence: high
    category: secret
    description: A PEM private key header; the body is usually adjacent in the capture.
    tags: [secret, key, pem]

  - id: putty_private_key
    title: "Possible PuTTY private key"
    regex: 'PuTTY-User-Key-File-\d+:'
    severity: high
    confidence: high
    category: secret
    description: A PuTTY private key file header.
    tags: [secret, key, putty]

  - id: ssh_private_key_openssh
    title: "OpenSSH private key header"
    regex: '-----BEGIN OPENSSH PRIVATE KEY-----'
    severity: high
    confidence: high
    category: secret
    description: An OpenSSH-format private key.
    tags: [secret, key, ssh]

  - id: pfx_pkcs12
    title: "Possible PKCS#12 / PFX container"
    regex: '\.(?:pfx|p12|pkcs12)\b'
    severity: medium
    confidence: low
    category: secret
    description: >-
      A reference to a PKCS#12 container, which normally bundles a private key
      with a certificate.
    tags: [secret, certificate, heuristic]

  - id: htpasswd_entry
    title: "Possible htpasswd entry"
    regex: '(?m)^([A-Za-z0-9._\-]{1,64}):(\$(?:apr1|2[aby]|1|5|6)\$[^\s:]{1,120}|{SHA})[^\s]*$'
    severity: medium
    confidence: medium
    category: credential
    description: A username:hash pair in htpasswd format.
    tags: [credential, http, hash]

  - id: netrc_credentials
    title: "Possible .netrc credentials"
    regex: '(?m)^machine\s+\S+\s+login\s+\S+\s+password\s+\S+'
    severity: high
    confidence: high
    category: credential
    description: A .netrc machine/login/password triple.
    tags: [credential, netrc, ftp]

  - id: smtp_auth_plain
    title: "Possible SMTP AUTH PLAIN credential"
    regex: '\bAUTH\s+PLAIN\s+[A-Za-z0-9+/=]{8,}'
    severity: high
    confidence: high
    category: credential
    decoders: [base64]
    description: >-
      An SMTP AUTH PLAIN exchange. The base64 argument is authzid\0authcid\0password.
    tags: [credential, smtp, base64]

  - id: imap_login_plain
    title: "Possible IMAP/POP3 plaintext login"
    regex: '(?im)^\s*(?:a\d*\s+)?(?:LOGIN|AUTHENTICATE)\s+\S+\s+\S+'
    severity: high
    confidence: medium
    category: credential
    description: A plaintext LOGIN command carrying a username and password.
    tags: [credential, imap, plaintext]

  - id: telnet_login_plain
    title: "Possible Telnet plaintext login"
    regex: '(?i)\b(?:login|username)\s*:\s*(\S+)\s*(?:\r\n|\n|\s){0,2}\s*(?:password|passwd)\s*:\s*(\S+)'
    severity: high
    confidence: medium
    category: credential
    description: A Telnet-style username/password prompt pair in cleartext.
    tags: [credential, telnet, plaintext]

  - id: redis_auth
    title: "Possible Redis AUTH credential"
    regex: '(?m)^\s*AUTH\s+\S.{3,128}$'
    severity: medium
    confidence: medium
    category: credential
    description: A Redis AUTH command observed as a line of stream data.
    tags: [credential, redis, plaintext]

  - id: mongodb_uri_password
    title: "Possible MongoDB URI with password"
    regex: 'mongodb(?:\+srv)?://[^\s:@/]{1,64}:([^\s:@/]{1,128})@'
    severity: high
    confidence: high
    category: secret
    description: A MongoDB connection URI carrying an inline password.
    tags: [secret, database, mongodb]

  - id: firebase_url
    title: "Possible Firebase database URL"
    regex: '\bhttps?://[a-z0-9\-]{1,60}\.firebaseio\.com\b'
    severity: low
    confidence: medium
    category: metadata
    description: >-
      A Firebase realtime-database URL. Worth noting because these databases
      are sometimes open; BADNET does not test that.
    tags: [metadata, cloud, firebase]

  - id: s3_bucket_url
    title: "Possible S3 bucket URL"
    regex: '\bhttps?://[a-z0-9.\-]{1,80}\.s3(?:[.-][a-z0-9\-]{1,40})?\.amazonaws\.com\b'
    severity: info
    confidence: high
    category: metadata
    description: An S3 object URL observed in traffic.
    tags: [metadata, cloud, s3]

  - id: github_pat
    title: "Possible GitHub token"
    regex: '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}'
    severity: high
    confidence: high
    category: secret
    description: A GitHub token prefix match.
    tags: [secret, vcs, github]

  - id: stripe_secret
    title: "Possible Stripe secret key"
    regex: '\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}\b'
    severity: high
    confidence: high
    category: secret
    description: A Stripe secret or restricted key prefix match.
    tags: [secret, payment, stripe]

  - id: twilio_key
    title: "Possible Twilio API key"
    regex: '\bSK[0-9a-fA-F]{32}\b|\bAC[0-9a-f]{32}\b'
    severity: medium
    confidence: low
    category: secret
    description: >-
      A Twilio-style account SID or API key. Confidence is low because many
      non-secret identifiers share the prefix shape.
    tags: [secret, telephony, heuristic]

  - id: generic_env_secret
    title: "Possible secret in environment-style data"
    regex: '(?m)^\s*(?:[A-Z][A-Z0-9_]{3,40}(?:SECRET|TOKEN|PASSWORD|KEY|CREDENTIALS))\s*=\s*(\S{6,256})$'
    severity: medium
    confidence: medium
    category: secret
    description: >-
      A SCREAMING_SNAKE variable name ending in SECRET/TOKEN/PASSWORD/KEY with a
      literal value - the shape of a leaked .env or docker-compose file.
    tags: [secret, env, config]

  - id: base64_blob_long
    title: "Possible base64-encoded blob"
    regex: '\b[A-Za-z0-9+/]{40,}={0,2}\b'
    severity: info
    confidence: low
    category: encoding
    decoders: [base64]
    description: >-
      A long base64-looking run of characters. Reported at info level because
      base64 is ubiquitous in HTTP; the report shows what it decodes to so you
      can decide quickly.
    tags: [encoding, base64, noise-prone]

  - id: hex_blob_long
    title: "Possible hex-encoded blob"
    regex: '\b(?:0x)?(?:[0-9a-fA-F]{2}){20,}\b'
    severity: info
    confidence: low
    category: encoding
    decoders: [hex]
    description: A long run of hex byte pairs.
    tags: [encoding, hex, noise-prone]